name: Market News Agent

on:
  schedule:
    - cron: "*/30 * * * *"     # هر ۳۰ دقیقه یک اجرا در صف می‌ماند؛ اجرای قبلی که تمام شود بعدی بلافاصله شروع می‌شود
  workflow_dispatch:           # اجرای دستی از تب Actions

concurrency:
  group: news-agent            # فقط یک نمونه هم‌زمان؛ بقیه در صف می‌مانند (پست تکراری نمی‌رود)
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # بازگردانی استیت دور قبل (خبرهای دیده‌شده + تیترهای اخیر)
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: news_seen.json
          key: news-state-${{ github.run_id }}
          restore-keys: news-state-

      - name: Prepare config
        run: '[ -f news_config.json ] || echo "{}" > news_config.json'

      # برنامه حدود ۵۵ دقیقه در حلقه می‌ماند و هر ۶۰ ثانیه فیدها را چک می‌کند؛
      # بعد timeout سیگنال می‌فرستد، برنامه استیت را ذخیره می‌کند و تمام می‌شود (کد 124 عادی است)
      - name: Run agent (loop ~55 min)
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHANNEL: ${{ secrets.TG_CHANNEL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          timeout 3300 python news_agent.py || [ $? -eq 124 ]

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: news_seen.json
          key: news-state-${{ github.run_id }}
